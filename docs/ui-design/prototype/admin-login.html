<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quản trị — Đăng nhập</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script>window.DC_ROUTES = {"Welcome.dc.html": "welcome.html", "Main.dc.html": "main.html", "AdminLogin.dc.html": "admin-login.html", "AdminDocs.dc.html": "admin-docs.html", "AdminDocDetail.dc.html": "admin-doc-detail.html", "AdminFeedback.dc.html": "admin-feedback.html"};</script>
<script src="dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F5F6F8}
*{box-sizing:border-box}
a{color:#000066}a:hover{color:#C81E0A}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #000066;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hist:not([aria-current="page"]):hover{background:#F1F3F6 !important}
.chip:hover{border-color:#9AA3B2 !important}
.ghost:hover:not(:disabled){background:#F1F3F6 !important}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 20px; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #111827; background: #F5F6F8; font-size: 15px; line-height: 1.6">
  <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 12px; justify-content: center">
      <svg width="44" height="44" viewBox="0 0 48 48" role="img" aria-label="Biểu tượng Trợ lý Học vụ" style="flex: none; display: block"><rect width="48" height="48" rx="12" fill="#000066"></rect><g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"><path d="M9 13h9a5 5 0 0 1 5 5v18a3.5 3.5 0 0 0-3.5-3.5H9z"></path><path d="M37 13h-9a5 5 0 0 0-5 5"></path></g><circle cx="32.5" cy="29" r="6.2" fill="#000066" stroke="#F5250C" stroke-width="3"></circle><line x1="37" y1="33.5" x2="40.5" y2="37" stroke="#F5250C" stroke-width="3.2" stroke-linecap="round"></line></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.3">
        <span style="font-weight: 700; font-size: 17px">Trợ lý Học vụ</span>
        <span style="font-size: 13px; color: #5B6472">Khu vực quản trị dữ liệu</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 32px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">Đăng nhập quản trị</h1>
        <p style="margin: 0; font-size: 14px; color: #4B5563">Dành cho người quản lý kho tài liệu và phản hồi.</p>
      </div>

      <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #FEEDEB; border: 1px solid #F7C4BC; color: #B01C08; font-size: 14px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          {{ err }}
        </p>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="u" style="font-size: 14px; font-weight: 600">Tên đăng nhập</label>
        <input id="u" type="text" autocomplete="username" value="{{ u }}" onChange="{{ onU }}" aria-invalid="{{ uErr }}" style="height: 44px; padding: 0 12px; border: 1px solid {{uBorder}}; border-radius: 10px; font-size: 15px; color: #111827">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="p" style="font-size: 14px; font-weight: 600">Mật khẩu</label>
        <input id="p" type="password" autocomplete="current-password" value="{{ p }}" onChange="{{ onP }}" aria-invalid="{{ pErr }}" style="height: 44px; padding: 0 12px; border: 1px solid {{pBorder}}; border-radius: 10px; font-size: 15px; color: #111827">
      </div>

      <sc-if value="{{ canGo }}" hint-placeholder-val="{{ false }}">
        <a href="AdminDocs.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 10px; background: #000066; color: #FFFFFF; font-weight: 600; text-decoration: none; font-size: 15px">Đăng nhập</a>
      </sc-if>
      <sc-if value="{{ cannotGo }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ submit }}" style="display: flex; align-items: center; justify-content: center; height: 46px; border: none; border-radius: 10px; background: #000066; color: #FFFFFF; font-weight: 600; font-size: 15px">Đăng nhập</button>
      </sc-if>
    </div>

    <p style="margin: 0; text-align: center; font-size: 14px; color: #4B5563">Bạn là sinh viên? Không cần đăng nhập — <a href="Welcome.dc.html">về trang tra cứu</a>.</p>
  </div>
  <!-- TOAST -->
  <sc-if value="{{ toast.show }}" hint-placeholder-val="{{ false }}">
    <div role="status" aria-live="polite" style="position: fixed; right: 24px; bottom: 24px; z-index: 60; width: min(400px, calc(100vw - 48px)); display: flex; align-items: flex-start; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 12px; background: {{toast.bg}}; color: #FFFFFF; box-shadow: 0 10px 30px rgba(0, 0, 40, 0.25); font-size: 14px; line-height: 1.5">
      <sc-if value="{{ toast.isOk }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><polyline points="20 6 9 17 4 12"></polyline></svg></sc-if>
      <sc-if value="{{ toast.isErr }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></sc-if>
      <sc-if value="{{ toast.isInfo }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></sc-if>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <strong style="font-weight: 700">{{ toast.title }}</strong>
        <span>{{ toast.text }}</span>
      </div>
      <button type="button" onClick="{{ closeToast }}" aria-label="Đóng thông báo" style="flex: none; width: 32px; height: 32px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"simulateError":{"editor":"boolean","default":false,"section":"Mô phỏng"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._toastT); }
  notify(type, title, text) {
    var self = this;
    clearTimeout(this._toastT);
    this.setState({ toast: { type: type, title: title, text: text } });
    this._toastT = setTimeout(function () { self.setState({ toast: null }); }, 4500);
  }
  renderVals() {
    var st = this.state || {};
    var self = this;
    var fail = !!this.props.simulateError;
    var u = st.u || '', p = st.p || '';
    var filled = u.trim().length > 0 && p.length > 0;
    var TOAST_BG = { ok: '#0E5132', err: '#B01C08', info: '#000066' };
    var t = st.toast;
    return {
      u: u, p: p,
      onU: function (e) { self.setState({ u: e.target.value, err: '', uErr: false }); },
      onP: function (e) { self.setState({ p: e.target.value, err: '', pErr: false }); },
      uErr: !!st.uErr, pErr: !!st.pErr,
      uBorder: st.uErr ? '#C81E0A' : '#C9CED6',
      pBorder: st.pErr ? '#C81E0A' : '#C9CED6',
      hasErr: !!st.err, err: st.err || '',
      canGo: filled && !fail,
      cannotGo: !(filled && !fail),
      submit: function () {
        if (!filled) {
          self.setState({ err: 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.', uErr: !u.trim(), pErr: !p });
          return;
        }
        self.setState({ err: 'Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.', uErr: true, pErr: true });
        self.notify('err', 'Đăng nhập thất bại', 'Thông tin đăng nhập không chính xác.');
      },
      toast: { show: !!t, isOk: !!t && t.type === 'ok', isErr: !!t && t.type === 'err', isInfo: !!t && t.type === 'info',
        bg: t ? TOAST_BG[t.type] : '#000066', title: t ? t.title : '', text: t ? t.text : '' },
      closeToast: function () { clearTimeout(self._toastT); self.setState({ toast: null }); }
    };
  }
}
</script>
</body>
</html>
